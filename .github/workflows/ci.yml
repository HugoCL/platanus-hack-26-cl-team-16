# CI for pull requests and main. How it fits with deploys and what it costs: docs/deploy.md.
name: CI

on:
  pull_request:
    # Skip changes that only touch Markdown or tickets. The vendored skills and docs/skills.md are
    # Markdown that `pnpm skills:check` verifies, so they stay in.
    paths: &paths
      - "**"
      - "!**/*.md"
      - "!.scratch/**"
      - ".agents/**"
      - "docs/skills.md"
  push:
    branches: [main]
    paths: *paths

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Every commit is mirrored to platanus-hack/platanus-hack-26-cl-team-16. Run only on origin.
    if: github.repository == 'HugoCL/platanus-hack-26-cl-team-16'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's version comes from `packageManager` in package.json, Node's from .node-version.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm skills:check
      - run: pnpm test
      # `pnpm build` runs `pnpm typecheck` first, so there is no separate typecheck step.
      - run: pnpm build
      # `pnpm smoke` is not here: Clerk does not create its keyless app on a CI runner, so
      # `next dev` fails without real Clerk keys. See docs/deploy.md.
